<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3×3×3 方塊（手勢旋轉 + 點選顯示文字）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page"><!-- 整頁縮放 67% -->
      <div class="container">
        <div class="left">
          <h1 id="info">請點選任一小方塊</h1>
          <p class="sub">（用手指/拖曳旋轉視角）</p>
        </div>

        <div class="stage" id="stage">
          <!-- three.js 畫布會插入到這裡 -->
          <div class="hint">拖曳旋轉；滾輪縮放</div>
        </div>
      </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
