<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3×3×3 方塊（可旋轉 + 長按提示）</title>
<style>
  :root { --bg:#0f1115; --panel:#151821; --text:#e8eefb; --muted:#97a1b7; --border:#262b36; }
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{height:100%;display:flex;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
  .stage{flex:1 1 auto;position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:radial-gradient(1200px 800px at 30% 20%,#1a2030 0%,#10131b 45%,#0f1115 100%)}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:12px;bottom:12px;padding:6px 10px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:8px;backdrop-filter:blur(6px);user-select:none}
  .tooltip{position:absolute;pointer-events:none;transform:translate(12px,12px);padding:8px 10px;font-size:12px;background:#10131b;border:1px solid var(--border);border-radius:8px;color:var(--text);display:none;max-width:220px;line-height:1.4}
  .tip-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;border:1px solid #fff3}
  .side{width:320px;flex:0 0 320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .side h2{margin:0 0 8px;font-size:18px}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:6px 8px;font-size:14px}
  .kv .k{color:var(--muted)}
  @media (max-width:980px){.wrap{flex-direction:column}.side{width:100%;flex-basis:auto}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <div class="hud">滑鼠拖曳/雙指旋轉縮放；<strong>長按 0.6 秒</strong>小方塊顯示資訊</div>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <aside class="side">
      <h2>方塊資訊</h2>
      <div class="kv">
        <div class="k">目前選取：</div><div id="sel">—</div>
        <div class="k">座標：</div><div id="coords">—</div>
        <div class="k">世界位置：</div><div id="world">—</div>
        <div class="k">顏色：</div><div id="color">—</div>
      </div>
    </aside>
  </div>

  <!-- three.js + OrbitControls（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (()=>{

    const stage = document.getElementById('stage');
    const tooltip = document.getElementById('tooltip');
    const selEl = document.getElementById('sel');
    const coordsEl = document.getElementById('coords');
    const worldEl = document.getElementById('world');
    const colorEl = document.getElementById('color');

    // --- three 基本場景 ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, stage.clientWidth/stage.clientHeight, 0.1, 100);
    camera.position.set(6,6,6);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    renderer.shadowMap.enabled = true;
    stage.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, .55));
    const dir = new THREE.DirectionalLight(0xffffff, .9);
    dir.position.set(5,8,6); dir.castShadow=true; scene.add(dir);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = .08;
    controls.minDistance = 4; controls.maxDistance = 20; controls.enablePan = true;

    // --- 3×3×3 小方塊 ---
    const rubiks = new THREE.Group(); scene.add(rubiks);
    const geo = new THREE.BoxGeometry(.95, .95, .95);
    const gap = 1.02;
    function colorFor(x,y,z){
      const palette=[0xff6b6b,0xff8e6e,0xffd36e,0xa7f070,0x6ef2e6,0x6eb5ff,0xc79bff,0xff8bd1,0xffffff];
      const idx=(x+1)*9+(y+1)*3+(z+1);
      return palette[(idx + (x!==0) + (y!==0) + (z!==0)) % palette.length];
    }
    let id=1;
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
      const cube=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
        color:colorFor(x,y,z), roughness:.45, metalness:.2
      }));
      cube.castShadow=true; cube.receiveShadow=true;
      cube.position.set(x*gap,y*gap,z*gap);
      cube.userData={ id:id++, grid:{x,y,z} };
      rubiks.add(cube);
    }
    rubiks.rotation.set(.4,.6,0);

    // --- 拾取 / 長按提示 ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered=null, hoverEm = new THREE.Color(0x333333);

    function setPointer(e){
      const r = renderer.domElement.getBoundingClientRect();
      const cx = ( (e.clientX ?? e.touches?.[0].clientX) - r.left ) / r.width;
      const cy = ( (e.clientY ?? e.touches?.[0].clientY) - r.top ) / r.height;
      pointer.set(cx*2-1, -(cy*2-1));
      // 也記錄實際像素位置給 tooltip
      pointer.screenX = (e.clientX ?? e.touches?.[0].clientX);
      pointer.screenY = (e.clientY ?? e.touches?.[0].clientY);
    }

    function intersect(){ raycaster.setFromCamera(pointer, camera); return raycaster.intersectObjects(rubiks.children,false); }
    function clearHover(){
      if(hovered && hovered.material.emissive){ hovered.material.emissive.setHex(0x000000); }
      hovered=null;
    }

    renderer.domElement.addEventListener('mousemove', e=>{
      setPointer(e);
      const hits = intersect();
      if(hits.length){
        const o = hits[0].object;
        if(hovered!==o){
          clearHover(); hovered=o;
          if(hovered.material.emissive) hovered.material.emissive.copy(hoverEm);
        }
      }else{ clearHover(); }
    }, {passive:true});

    // 長按邏輯
    let pressTimer=null, pressTarget=null, downPos=null;
    const LONG_MS=600, MOVE_TOL=6;

    function startPress(e){
      setPointer(e); downPos={x:pointer.screenX,y:pointer.screenY,t:performance.now()};
      const hits = intersect();
      pressTarget = hits[0]?.object ?? null;
      if(!pressTarget) return;
      // 若使用者長按不移動 → 顯示 tooltip
      pressTimer = setTimeout(()=> showTip(pressTarget, pointer.screenX, pointer.screenY), LONG_MS);
    }
    function cancelPress(e){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
    }
    function moveDuringPress(e){
      if(!downPos) return;
      setPointer(e);
      const moved = Math.hypot(pointer.screenX - downPos.x, pointer.screenY - downPos.y);
      if(moved > MOVE_TOL) cancelPress();
    }

    function showTip(obj, x, y){
      // 面板更新
      const {id,grid}=obj.userData; const wpos=new THREE.Vector3(); obj.getWorldPosition(wpos);
      const col = obj.material.color; const hex="#"+col.getHexString().toUpperCase();
      selEl.textContent="Cubie #"+id;
      coordsEl.textContent=`(${grid.x}, ${grid.y}, ${grid.z})`;
      worldEl.textContent=`(${wpos.x.toFixed(2)}, ${wpos.y.toFixed(2)}, ${wpos.z.toFixed(2)})`;
      colorEl.textContent=hex; colorEl.style.color=hex;

      // tooltip 內容 + 位置
      tooltip.innerHTML = `<span class="tip-dot" style="background:${hex}"></span>
        <strong>Cubie #${id}</strong><br>
        座標：(${grid.x}, ${grid.y}, ${grid.z})<br>
        顏色：${hex}`;
      tooltip.style.left = x + "px";
      tooltip.style.top  = y + "px";
      tooltip.style.display="block";
    }
    function hideTip(){ tooltip.style.display="none"; }

    // 事件綁定（滑鼠 + 觸控）
    const el = renderer.domElement;
    el.addEventListener('pointerdown', e=>{ hideTip(); startPress(e); });
    el.addEventListener('pointerup',   e=>{ cancelPress(); });
    el.addEventListener('pointerleave',e=>{ cancelPress(); hideTip(); });
    el.addEventListener('pointermove', e=>{ moveDuringPress(e); });

    // 縮放更新
    function onResize(){
      const w=stage.clientWidth, h=stage.clientHeight;
      camera.aspect=w/h; camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    }
    addEventListener('resize', onResize); onResize();

    (function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene,camera);
    })();

  })();
  </script>
</body>
</html>
