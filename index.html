<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>可旋轉 3×3×3 方塊示範</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel-bg: #151821;
      --text: #e8eefb;
      --muted: #97a1b7;
      --accent: #5cc8ff;
      --border: #262b36;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .app {
      display: flex; gap: 16px; height: 100%; padding: 16px; max-width: 1400px; margin: 0 auto;
    }
    .stage {
      flex: 1 1 auto; position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      background: radial-gradient(1200px 800px at 30% 20%, #1a2030 0%, #10131b 45%, #0f1115 100%);
      min-width: 0; /* for flex shrink */
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted);
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; backdrop-filter: blur(6px);
      user-select: none;
    }
    .panel {
      width: 320px; flex: 0 0 320px; background: var(--panel-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .panel h2 { margin: 0; font-size: 18px; letter-spacing: .3px; }
    .panel .card {
      background: #10131b; border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    }
    .kv { display: grid; grid-template-columns: 80px 1fr; row-gap: 6px; column-gap: 8px; font-size: 14px; }
    .kv .k { color: var(--muted); }
    .badge {
      display: inline-block; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted);
    }
    .footer {
      margin-top: auto; font-size: 12px; color: var(--muted);
      border-top: 1px dashed var(--border); padding-top: 10px;
    }
    @media (max-width: 980px) {
      .app { flex-direction: column; }
      .panel { width: 100%; flex-basis: auto; }
      .footer { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <div class="hud">拖曳旋轉、滾輪縮放；點選小方塊查看資訊</div>
    </div>
    <aside class="panel" id="panel">
      <h2>方塊資訊</h2>
      <div class="card" id="card">
        <div style="margin-bottom:8px;"><span class="badge" id="idBadge">未選取</span></div>
        <div class="kv">
          <div class="k">索引：</div><div id="index">—</div>
          <div class="k">座標：</div><div id="coords">—</div>
          <div class="k">世界位置：</div><div id="world">—</div>
          <div class="k">顏色：</div><div id="color">—</div>
        </div>
      </div>
      <div class="footer">提示：按住 <strong>Shift</strong> 拖曳可平移視角；雙指縮放（觸控）。</div>
    </aside>
  </div>

  <!-- Three.js 與 OrbitControls（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // --- 基本場景設定 ---
    const stageEl = document.getElementById('stage');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, stageEl.clientWidth / stageEl.clientHeight, 0.1, 100);
    camera.position.set(6, 6, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
    renderer.shadowMap.enabled = true;
    stageEl.appendChild(renderer.domElement);

    // 光源
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(5, 8, 6);
    dir.castShadow = true;
    scene.add(dir);

    // 控制器（滑鼠旋轉/縮放/平移）
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.enablePan = true;
    controls.panSpeed = 0.6;

    // --- 建立 3×3×3 小方塊 ---
    const rubiks = new THREE.Group();
    scene.add(rubiks);

    const size = 0.95;     // 小方塊邊長（留出縫隙更好看）
    const gap = 1.02;      // 排列間距
    const geo = new THREE.BoxGeometry(size, size, size);

    // 色板：依空間八象限 + 中心，給一點變化
    function colorFor(x, y, z) {
      // 將 -1,0,1 map 成 0,1,2 -> 計算 index
      const ix = x + 1, iy = y + 1, iz = z + 1;
      const idx = ix * 9 + iy * 3 + iz; // 0..26
      const palette = [
        0xff6b6b, 0xff8e6e, 0xffd36e,
        0xa7f070, 0x6ef2e6, 0x6eb5ff,
        0xc79bff, 0xff8bd1, 0xffffff
      ];
      // 簡單依 idx 分組挑色
      return palette[(idx + (x !== 0) + (y !== 0) + (z !== 0)) % palette.length];
    }

    const cubies = [];
    let idCounter = 1;

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const mat = new THREE.MeshStandardMaterial({
            color: colorFor(x, y, z),
            roughness: 0.45,
            metalness: 0.2
          });
          const cube = new THREE.Mesh(geo, mat);
          cube.castShadow = true; cube.receiveShadow = true;
          cube.position.set(x * gap, y * gap, z * gap);

          // 自定義資料（用於顯示）
          cube.userData = {
            id: idCounter++,
            grid: { x, y, z }
          };

          rubiks.add(cube);
          cubies.push(cube);
        }
      }
    }

    // 輕微旋轉初始角度，避免完全正對視角
    rubiks.rotation.set(0.4, 0.6, 0);

    // --- 射線拾取（點擊/懸停） ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let hovered = null;
    const hoverEmissive = new THREE.Color(0x333333);

    function setPointerFromEvent(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ( (e.clientX - rect.left) / rect.width ) * 2 - 1;
      const y = - ( (e.clientY - rect.top) / rect.height ) * 2 + 1;
      pointer.set(x, y);
    }

    function intersect() {
      raycaster.setFromCamera(pointer, camera);
      // 只對 rubiks 內的 mesh 做相交測試
      return raycaster.intersectObjects(rubiks.children, false);
    }

    function clearHover() {
      if (hovered) {
        const m = hovered.material;
        if (m && m.emissive) m.emissive.setHex(0x000000);
        hovered = null;
      }
    }

    renderer.domElement.addEventListener('mousemove', (e) => {
      setPointerFromEvent(e);
      const hits = intersect();
      if (hits.length) {
        const hit = hits[0].object;
        if (hovered !== hit) {
          clearHover();
          hovered = hit;
          if (hovered.material.emissive) hovered.material.emissive.copy(hoverEmissive);
        }
      } else {
        clearHover();
      }
    });

    // 防止拖曳旋轉時誤觸點擊：記錄移動距離
    let downPos = null;
    renderer.domElement.addEventListener('pointerdown', (e) => {
      downPos = { x: e.clientX, y: e.clientY, t: performance.now() };
    });

    renderer.domElement.addEventListener('click', (e) => {
      if (downPos) {
        const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        const elapsed = performance.now() - downPos.t;
        // 若移動過多或按太久，視為旋轉操作，不觸發點選
        if (moved > 4 || elapsed > 600) return;
      }
      setPointerFromEvent(e);
      const hits = intersect();
      if (hits.length) {
        showInfo(hits[0].object);
      }
    });

    // --- 右側面板顯示 ---
    const idBadge = document.getElementById('idBadge');
    const idxEl = document.getElementById('index');
    const coordsEl = document.getElementById('coords');
    const worldEl = document.getElementById('world');
    const colorEl = document.getElementById('color');

    function showInfo(obj) {
      const { id, grid } = obj.userData;
      const world = new THREE.Vector3();
      obj.getWorldPosition(world);

      idBadge.textContent = `Cubie #${id}`;
      idxEl.textContent = `${id}`;
      coordsEl.textContent = `(${grid.x}, ${grid.y}, ${grid.z})`;
      worldEl.textContent = `(${world.x.toFixed(2)}, ${world.y.toFixed(2)}, ${world.z.toFixed(2)})`;

      const col = obj.material.color;
      const hex = `#${col.getHexString()}`;
      colorEl.textContent = hex.toUpperCase();
      colorEl.style.color = hex;
    }

    // --- 動畫迴圈與自適應 ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function onResize() {
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    // 初始一次
    onResize();
  </script>
</body>
</html>
