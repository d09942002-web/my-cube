<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS 3D 立方體</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="container">
      <div class="left">
        <h1>Welcome</h1>
        <p class="sub-heading">to the world of amazing designs</p>
      </div>

      <div class="cube-container" id="cubeWrap">
        <div class="cube">
          <div class="cube-face front">Web Design</div>
          <div class="cube-face back">App Development</div>
          <div class="cube-face left">SEO</div>
          <div class="cube-face right">WordPress</div>
          <div class="cube-face top">Blogger</div>
          <div class="cube-face bottom">WooCommerce</div>
        </div>
      </div>
    </header>

    <script src="main.js"></script>
  </body>
</html>
