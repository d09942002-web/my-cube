<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3×3×3 方塊（白底・拖曳旋轉・點選顯示）</title>
<style>
  html,body{height:100%}body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .page{zoom:.100}
  @supports not (zoom: 1){.page{transform:scale(.100);transform-origin:top left;width:149.25vw;height:149.25vh}}
  .container{min-height:100vh;max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px}
  .title{margin:0;font-size:64px;line-height:1.05}
  .sub{margin:8px 0 0;color:#555}
  .stage{position:relative;border:1px solid #e5e7eb;border-radius:12px;background:#fff;min-height:70vh;touch-action:none;user-select:none}
  .stage canvas{display:block;width:100%;height:100%}
  .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#374151;background:#ffffffcc;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;backdrop-filter:blur(3px)}
  @media (max-width:900px){.container{grid-template-columns:1fr}.title{font-size:42px}}
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <div>
      <h1 class="title" id="info">請點選任一小方塊</h1>
      <p class="sub">（用手指/拖曳旋轉視角；滾輪縮放）</p>
      <noscript style="color:#b91c1c;font-weight:600">此頁需要啟用 JavaScript。</noscript>
    </div>
    <div class="stage" id="stage"><div class="hint">拖曳旋轉；滾輪縮放</div></div>
  </div>
</div>

<!-- three.js：主要 CDN；失敗則自動切到備援 CDN -->
<script>
(function addThree(){
  var s=document.createElement('script');
  s.src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js";
  s.onerror=function(){
    var b=document.createElement('script');
    b.src="https://unpkg.com/three@0.158.0/build/three.min.js";
    document.head.appendChild(b);
  };
  document.head.appendChild(s);
})();
</script>

<script>
(function main(){
  function ready(fn){ if (window.THREE) fn(); else setTimeout(()=>ready(fn), 30); }
  ready(function(){
    const stage = document.getElementById("stage");
    const info  = document.getElementById("info");

    // 場景 + 相機
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, stage.clientWidth/stage.clientHeight, 0.1, 100);
    camera.position.set(6,6,6);
    camera.lookAt(0,0,0);                 // ★ 讓相機看向原點

    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    renderer.setClearColor(0xffffff, 1);   // ★ 白色背景
    stage.appendChild(renderer.domElement);

    // 光
    scene.add(new THREE.AmbientLight(0xffffff, .85));
    const dir = new THREE.DirectionalLight(0xffffff, .7); dir.position.set(5,7,6); scene.add(dir);

    // 3×3×3
    const group = new THREE.Group(); scene.add(group);
    const geo = new THREE.BoxGeometry(.95,.95,.95), gap=1.02;
    function colorFor(x,y,z){
      const p=[0xff6666,0xffa94d,0xffe166,0x8bd17c,0x57d4d4,0x6ea8ff,0xb190ff,0xff84c1,0xffffff];
      const idx=(x+1)*9+(y+1)*3+(z+1);
      return p[(idx+(x!==0)+(y!==0)+(z!==0))%p.length];
    }
    let nid=1;
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
      const m=new THREE.MeshStandardMaterial({color:colorFor(x,y,z),roughness:.4,metalness:0});
      const c=new THREE.Mesh(geo,m);
      c.position.set(x*gap,y*gap,z*gap); c.userData={id:nid++,grid:{x,y,z}}; group.add(c);
    }
    group.rotation.set(.4,.6,0);

    // 拖曳旋轉（pointer）
    let dragging=false,lastX=0,lastY=0;
    let rotX=THREE.MathUtils.radToDeg(group.rotation.x);
    let rotY=THREE.MathUtils.radToDeg(group.rotation.y);
    const S=0.4;
    function getXY(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
    stage.addEventListener("pointerdown",e=>{const p=getXY(e);dragging=true;lastX=p.x;lastY=p.y;});
    window.addEventListener("pointermove",e=>{if(!dragging)return;const p=getXY(e);const dx=p.x-lastX,dy=p.y-lastY;rotY+=dx*S;rotX-=dy*S;group.rotation.y=THREE.MathUtils.degToRad(rotY);group.rotation.x=THREE.MathUtils.degToRad(rotX);lastX=p.x;lastY=p.y;},{passive:true});
    window.addEventListener("pointerup",()=>{dragging=false;});
    stage.addEventListener("wheel",(e)=>{e.preventDefault();const s=1+Math.sign(e.deltaY)*0.08;camera.position.multiplyScalar(s);},{passive:false});

    // 點選顯示文字
    const ray=new THREE.Raycaster(); const pointer=new THREE.Vector2(); let down=null;
    function setPointer(e){const r=renderer.domElement.getBoundingClientRect();const p=getXY(e);pointer.x=((p.x-r.left)/r.width)*2-1;pointer.y=-((p.y-r.top)/r.height)*2+1;}
    stage.addEventListener("pointerdown",e=>{const p=getXY(e);down={x:p.x,y:p.y,t:performance.now()};});
    stage.addEventListener("pointerup",e=>{
      if(!down)return; const p=getXY(e); const moved=Math.hypot(p.x-down.x,p.y-down.y); const elapsed=performance.now()-down.t;
      if(moved<=6 && elapsed<500){
        setPointer(e); ray.setFromCamera(pointer,camera);
        const hit=ray.intersectObjects(group.children,false)[0];
        if(hit){ const g=hit.object.userData.grid; const id=hit.object.userData.id;
          const hex="#"+hit.object.material.color.getHexString().toUpperCase();
          info.textContent=`你選取了 Cubie #${id}，座標 (${g.x}, ${g.y}, ${g.z})，顏色 ${hex}`;
        }
      }
      down=null;
    });

    // Resize 與渲染
    function onResize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
    window.addEventListener("resize", onResize); onResize();
    (function tick(){requestAnimationFrame(tick);renderer.render(scene,camera);})();
  });
})();
</script>
</body>
</html>
