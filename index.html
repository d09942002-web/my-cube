<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3×3×3 方塊（白底・拖曳旋轉・展開外層）</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  /* 整頁縮放 67% */
  .page{zoom:.67}
  @supports not (zoom: 1){.page{transform:scale(.67);transform-origin:top left;width:149.25vw;height:149.25vh}}
  .container{min-height:100vh;max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1.1fr;gap:24px}
  .title{margin:0;font-size:64px;line-height:1.05}
  .sub{margin:8px 0 0;color:#555}
  .stage{position:relative;border:1px solid #e5e7eb;border-radius:12px;background:#fff;min-height:70vh;touch-action:none;user-select:none;overflow:hidden}
  .stage canvas{display:block;width:100%;height:100%}
  .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#374151;background:#ffffffcc;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;backdrop-filter:blur(3px);z-index:5}
  /* 右上角按鈕（提高 z-index，避免被 canvas 蓋住） */
  .toolbar{position:absolute;right:10px;top:10px;display:flex;gap:8px;z-index:10}
  .btn{appearance:none;border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  @media (max-width:900px){.container{grid-template-columns:1fr}.title{font-size:42px}}
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <div>
      <h1 class="title" id="info">3×3×3 方塊</h1>
      <p class="sub">拖曳旋轉視角；滾輪縮放。右上角可展開/還原外層。</p>
      <noscript style="color:#b91c1c;font-weight:600">此頁需要啟用 JavaScript。</noscript>
    </div>
    <div class="stage" id="stage">
      <div class="toolbar"><button class="btn" id="explodeBtn">展開外層</button></div>
      <div class="hint">拖曳旋轉；滾輪縮放</div>
    </div>
  </div>
</div>

<!-- three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
(function main(){
  const stage = document.getElementById("stage");
  const explodeBtn = document.getElementById("explodeBtn");

  /* ====== 可調參數 ====== */
  const CUBE_SIZE = 1.10;   // 小方塊邊長（要更大就調這個）
  const GAP = 1.26;         // 小方塊之間的距離（含縫隙）
  const EXPLODE_DIST = 2.4; // 外層展開距離（越大展得越開）

  /* 場景 + 相機 + 渲染器 */
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, stage.clientWidth/stage.clientHeight, 0.1, 100);
  camera.position.set(6.6, 6.6, 6.6);
  camera.lookAt(0,0,0);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.setClearColor(0xffffff, 1);
  stage.appendChild(renderer.domElement);

  // 光
  scene.add(new THREE.AmbientLight(0xffffff, .85));
  const dir = new THREE.DirectionalLight(0xffffff, .7); dir.position.set(5,7,6); scene.add(dir);

  /* 建立 3×3×3（27 顆逐一列出） */
  const group = new THREE.Group(); scene.add(group);
  const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
  const cubes = [];

  // 色票（可自由變更）
  const RED=0xd63946, GREEN=0x06d6a0, YELLOW=0xffe166, BLUE=0x6ea8ff, PURPLE=0x3d348b, TEAL=0x57d4d4, ORANGE=0xffa94d, PINK=0xff84c1, WHITE=0xffffff;

  // 幫助函式：x,y,z,id,color,labelText（labelText 可自訂顯示文字）
  function addCube(x, y, z, id, color, labelText) {
    const mat = new THREE.MeshStandardMaterial({ color, roughness:.4, metalness:0 });
    const cube = new THREE.Mesh(geo, mat);
    const pos = new THREE.Vector3(x*GAP, y*GAP, z*GAP);
    cube.position.copy(pos);
    cube.userData = {
      id,
      grid:{x,y,z},
      labelText: labelText ?? `已選取一顆方塊 ${id}`,
      orig: pos.clone(),
      target: pos.clone(),
      t0:0, dur:0, anim:false
    };
    group.add(cube); cubes.push(cube);
  }

  // y = -1
  addCube(-1,-1,-1, 1, RED,    "這是 #1 (-1,-1,-1)");
  addCube(-1,-1, 0, 2, ORANGE, "這是 #2 (-1,-1, 0)");
  addCube(-1,-1, 1, 3, YELLOW, "這是 #3 (-1,-1, 1)");

  addCube( 0,-1,-1, 4, GREEN,  "這是 #4  ( 0,-1,-1)");
  addCube( 0,-1, 0, 5, WHITE,  "這是 #5  ( 0,-1, 0)");
  addCube( 0,-1, 1, 6, TEAL,   "這是 #6  ( 0,-1, 1)");

  addCube( 1,-1,-1, 7, BLUE,   "這是 #7  ( 1,-1,-1)");
  addCube( 1,-1, 0, 8, PINK,   "這是 #8  ( 1,-1, 0)");
  addCube( 1,-1, 1, 9, PURPLE, "這是 #9  ( 1,-1, 1)");

  // y =  0
  addCube(-1, 0,-1,10, TEAL,   "這是 #10 (-1, 0,-1)");
  addCube(-1, 0, 0,11, RED,    "這是 #11 (-1, 0, 0)");
  addCube(-1, 0, 1,12, ORANGE, "這是 #12 (-1, 0, 1)");

  addCube( 0, 0,-1,13, BLUE,   "這是 #13 ( 0, 0,-1)");
  addCube( 0, 0, 0,14, WHITE,  "這是 #14 ( 0, 0, 0)");
  addCube( 0, 0, 1,15, TEAL,   "這是 #15 ( 0, 0, 1)");

  addCube( 1, 0,-1,16, PINK,   "這是 #16 ( 1, 0,-1)");
  addCube( 1, 0, 0,17, GREEN,  "這是 #17 ( 1, 0, 0)");
  addCube( 1, 0, 1,18, YELLOW, "這是 #18 ( 1, 0, 1)");

  // y =  1
  addCube(-1, 1,-1,19, ORANGE, "這是 #19 (-1, 1,-1)");
  addCube(-1, 1, 0,20, YELLOW, "這是 #20 (-1, 1, 0)");
  addCube(-1, 1, 1,21, GREEN,  "這是 #21 (-1, 1, 1)");

  addCube( 0, 1,-1,22, PURPLE, "這是 #22 ( 0, 1,-1)");
  addCube( 0, 1, 0,23, WHITE,  "這是 #23 ( 0, 1, 0)");
  addCube( 0, 1, 1,24, BLUE,   "這是 #24 ( 0, 1, 1)");

  addCube( 1, 1,-1,25, TEAL,   "這是 #25 ( 1, 1,-1)");
  addCube( 1, 1, 0,26, PINK,   "這是 #26 ( 1, 1, 0)");
  addCube( 1, 1, 1,27, RED,    "這是 #27 ( 1, 1, 1)");

  group.rotation.set(.4,.6,0);

  /* 拖曳旋轉（pointer） */
  let dragging=false,lastX=0,lastY=0;
  let rotX=THREE.MathUtils.radToDeg(group.rotation.x);
  let rotY=THREE.MathUtils.radToDeg(group.rotation.y);
  const S=0.4;
  function getXY(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
  stage.addEventListener("pointerdown",e=>{const p=getXY(e);dragging=true;lastX=p.x;lastY=p.y;});
  window.addEventListener("pointermove",e=>{
    if(!dragging)return; const p=getXY(e);
    const dx=p.x-lastX, dy=p.y-lastY; rotY+=dx*S; rotX-=dy*S;
    group.rotation.y=THREE.MathUtils.degToRad(rotY);
    group.rotation.x=THREE.MathUtils.degToRad(rotX);
    lastX=p.x; lastY=p.y;
  },{passive:true});
  window.addEventListener("pointerup",()=>{dragging=false;});
  stage.addEventListener("wheel",(e)=>{e.preventDefault();const s=1+Math.sign(e.deltaY)*0.08;camera.position.multiplyScalar(s);},{passive:false});

  // ====== 點選小方塊 → 顯示自訂文字 ======
  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let down = null;

  const infoEl = document.getElementById('info'); // 要改成右上角就指向 infoBox

  function setPointer(e){
    const r = renderer.domElement.getBoundingClientRect();
    const p = getXY(e);
    pointer.x = ((p.x - r.left) / r.width) * 2 - 1;
    pointer.y = -((p.y - r.top) / r.height) * 2 + 1;
  }

  stage.addEventListener("pointerdown", (e) => {
    const p = getXY(e);
    down = { x: p.x, y: p.y, t: performance.now() };
  });

  stage.addEventListener("pointerup", (e) => {
    if (!down) return;
    const p = getXY(e);
    const moved = Math.hypot(p.x - down.x, p.y - down.y);
    const elapsed = performance.now() - down.t;

    if (moved <= 6 && elapsed < 500) {
      setPointer(e);
      ray.setFromCamera(pointer, camera);
      const hit = ray.intersectObjects(group.children, false)[0];
      if (hit) {
        const id = hit.object.userData.id;
        const text = hit.object.userData.labelText ?? `已選取一顆方塊 ${id}`;
        infoEl.textContent = text;
      }
    }
    down = null;
  });

  /* 右上角按鈕：外層散開 / 還原 */
  let expanded = false;
  function animateTo(cube, to, dur=500){
    cube.userData.t0 = performance.now();
    cube.userData.dur = dur;
    cube.userData.from = cube.position.clone();
    cube.userData.target = to.clone();
    cube.userData.anim = true;
  }
  function explodeOuter(){
    for(const c of cubes){
      const {x,y,z} = c.userData.grid;
      const isOuter = Math.abs(x)===1 || Math.abs(y)===1 || Math.abs(z)===1;
      if(!isOuter){ animateTo(c, c.userData.orig, 500); continue; } // 中央那顆不動
      const dir = new THREE.Vector3(Math.sign(x), Math.sign(y), Math.sign(z));
      if (dir.length() === 0){ animateTo(c, c.userData.orig, 500); continue; }
      dir.normalize();
      const target = c.userData.orig.clone().addScaledVector(dir, EXPLODE_DIST);
      animateTo(c, target, 600);
    }
  }
  function implodeOuter(){
    for(const c of cubes){ animateTo(c, c.userData.orig, 600); }
  }
  explodeBtn.addEventListener("click", ()=>{
    expanded ? implodeOuter() : explodeOuter();
    expanded = !expanded;
    explodeBtn.textContent = expanded ? "還原外層" : "展開外層";
  });

  /* Resize & Render */
  function onResize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
  window.addEventListener("resize", onResize); onResize();

  (function tick(){
    requestAnimationFrame(tick);
    // 簡易補間動畫
    const now = performance.now();
    for(const c of cubes){
      if(!c.userData.anim) continue;
      const {t0,dur,from,target} = c.userData;
      const t = Math.min(1, (now - t0)/dur);
      c.position.lerpVectors(from, target, t);
      if(t>=1) c.userData.anim = false;
    }
    renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
