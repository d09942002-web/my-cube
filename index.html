<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宮格目標進度圈</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
            color: #333;
        }

        /* 主畫面：大圈圈容器 */
        #main-view {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
            border-radius: 50%;
        }

        /* 單個小圈圈 */
        .circle {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.4s ease;
            user-select: none;
            /* 讓小圈圈的中心點對齊 */
            margin-top: -40px;
            margin-left: -40px; 
        }

        .circle:hover {
            transform: scale(1.1);
        }

        /* 旋轉動畫 */
        .rotating {
            animation: spin 15s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* 讓裡面的字保持正向的抵銷動畫 */
        .rotating .circle {
            animation: spin-reverse 15s linear infinite;
        }
        @keyframes spin-reverse {
            100% { transform: rotate(-360deg); }
        }

        /* 控制按鈕 */
        .control-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .control-btn:hover { background-color: #357abd; }

        /* 清單詳細畫面 */
        #detail-view {
            display: none;
            width: 320px;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header-area { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { margin-right: 15px; cursor: pointer; font-size: 20px; color: #4a90e2; background: none; border: none; }
        #detail-title { flex-grow: 1; text-align: center; margin: 0; font-size: 24px; color: #333; }

        .input-area { display: flex; margin-bottom: 20px; }
        .input-area input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px 0 0 6px; outline: none; }
        .input-area button { padding: 10px 15px; border: none; background: #4a90e2; color: white; border-radius: 0 6px 6px 0; cursor: pointer; }

        .task-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .task-item:last-child { border-bottom: none; }
        .task-checkbox { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
        .task-text { flex-grow: 1; font-size: 16px; transition: color 0.2s; }
        .task-item.completed .task-text { text-decoration: line-through; color: #aaa; }
        .delete-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-view">
        <div class="circle-container" id="circle-container">
            </div>
        <button class="control-btn" onclick="toggleRotation()">開始 / 停止旋轉</button>
    </div>

    <div id="detail-view">
        <div class="header-area">
            <button class="back-btn" onclick="closeDetail()">◀ 返回</button>
            <h2 id="detail-title">主題</h2>
            <div style="width: 20px;"></div> </div>
        <div class="input-area">
            <input type="text" id="new-task-input" placeholder="新增事項..." onkeypress="handleKeyPress(event)">
            <button onclick="addTask()">新增</button>
        </div>
        <ul class="task-list" id="task-list">
            </ul>
    </div>

    <script>
        // 定義 9 個圈圈的資料
        const circlesData = [
            { id: 0, title: '健康', hue: 0 },   // 紅色系
            { id: 1, title: '工作', hue: 40 },  // 橙色系
            { id: 2, title: '學習', hue: 60 },  // 黃色系
            { id: 3, title: '家庭', hue: 120 }, // 綠色系
            { id: 4, title: '理財', hue: 180 }, // 青色系
            { id: 5, title: '社交', hue: 200 }, // 淺藍系
            { id: 6, title: '休閒', hue: 240 }, // 藍色系
            { id: 7, title: '心靈', hue: 280 }, // 紫色系
            { id: 8, title: '目標', hue: 320 }  // 粉色系
        ];

        let tasks = JSON.parse(localStorage.getItem('myCircleTasks')) || {};
        let currentCircleId = null;
        let isRotating = false;

        // 初始化：如果 localStorage 是空的，幫每個 ID 建立空陣列
        circlesData.forEach(c => {
            if (!tasks[c.id]) tasks[c.id] = [];
        });

        // 保存資料到 LocalStorage
        function saveTasks() {
            localStorage.setItem('myCircleTasks', JSON.stringify(tasks));
        }

        // 渲染 9 個圈圈
        function renderCircles() {
            const container = document.getElementById('circle-container');
            container.innerHTML = ''; // 清空
            const radius = 160; // 大圓半徑
            const centerX = 200; // 容器中心 X (400/2)
            const centerY = 200; // 容器中心 Y (400/2)

            circlesData.forEach((circle, index) => {
                // 計算角度 (減去 Math.PI / 2 讓第一個點出現在 12 點鐘方向)
                const angle = (index * (360 / 9)) * (Math.PI / 180) - (Math.PI / 2);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                // 計算完成度以決定顏色深淺
                const circleTasks = tasks[circle.id];
                const total = circleTasks.length;
                const completed = circleTasks.filter(t => t.done).length;
                const ratio = total === 0 ? 0 : completed / total;

                // 顏色邏輯：亮度 (Lightness) 從 85% (淺) 到 45% (深)
                const lightness = 85 - (ratio * 40);
                const bgColor = `hsl(${circle.hue}, 70%, ${lightness}%)`;

                // 建立圈圈元素
                const div = document.createElement('div');
                div.className = 'circle';
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                div.style.backgroundColor = bgColor;
                div.innerText = circle.title;
                div.onclick = () => openDetail(circle.id);

                container.appendChild(div);
            });
        }

        // 開啟詳細清單畫面
        function openDetail(id) {
            currentCircleId = id;
            const circleInfo = circlesData.find(c => c.id === id);
            
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('detail-title').innerText = circleInfo.title;
            
            // 標題顏色同步為該圈圈的色系
            document.getElementById('detail-title').style.color = `hsl(${circleInfo.hue}, 70%, 40%)`;

            renderTaskList();
        }

        // 關閉詳細畫面，返回主畫面
        function closeDetail() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'flex';
            currentCircleId = null;
            renderCircles(); // 重新渲染以更新顏色
        }

        // 渲染清單項目
        function renderTaskList() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            
            const currentTasks = tasks[currentCircleId];

            currentTasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.done ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${index})">
                    <span class="task-text">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">✖</button>
                `;
                listEl.appendChild(li);
            });
        }

        // 新增任務
        function addTask() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (text) {
                tasks[currentCircleId].push({ text: text, done: false });
                saveTasks();
                input.value = '';
                renderTaskList();
            }
        }

        // 監聽 Enter 鍵新增
        function handleKeyPress(e) {
            if (e.key === 'Enter') addTask();
        }

        // 切換任務完成狀態
        function toggleTask(index) {
            tasks[currentCircleId][index].done = !tasks[currentCircleId][index].done;
            saveTasks();
            renderTaskList();
        }

        // 刪除任務
        function deleteTask(index) {
            tasks[currentCircleId].splice(index, 1);
            saveTasks();
            renderTaskList();
        }

        // 功能三：控制旋轉
        function toggleRotation() {
            const container = document.getElementById('circle-container');
            isRotating = !isRotating;
            if (isRotating) {
                container.classList.add('rotating');
            } else {
                container.classList.remove('rotating');
            }
        }

        // 網頁載入時執行
        window.onload = renderCircles;
    </script>
</body>
</html>
