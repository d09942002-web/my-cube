<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3×3×3 方塊（白底）</title>
<style>
  /* 白色極簡風格 */
  html,body{height:100%;margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;gap:12px;padding:16px}
  .stage{flex:1 1 auto;position:relative;border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-height:60vh}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:10px;bottom:10px;padding:6px 10px;font-size:12px;color:#374151;background:#ffffffcc;border:1px solid #e5e7eb;border-radius:8px;backdrop-filter:blur(3px);user-select:none}
  .tooltip{position:absolute;pointer-events:none;transform:translate(12px,12px);padding:8px 10px;font-size:12px;background:#111;color:#fff;border-radius:8px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;border:1px solid #fff8}
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" id="stage">
      <div class="hud">拖曳旋轉 / 滾輪縮放；<strong>長按 0.6 秒</strong> 顯示資訊</div>
      <div class="tooltip" id="tip"></div>
    </div>
  </div>

  <!-- three.js + OrbitControls（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (() => {
    const stage = document.getElementById('stage');
    const tip = document.getElementById('tip');

    // 場景
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, stage.clientWidth/stage.clientHeight, 0.1, 100);
    camera.position.set(6, 6, 6);

    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    stage.appendChild(renderer.domElement);

    // 白底下用柔和光
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
    dir.position.set(5,7,6); scene.add(dir);

    // 控制
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = .08;
    controls.minDistance = 4; controls.maxDistance = 20; controls.enablePan = true;

    // 3×3×3 方塊
    const group = new THREE.Group(); scene.add(group);
    const gap = 1.02, geo = new THREE.BoxGeometry(.95,.95,.95);

    function colorFor(x,y,z){
      // 亮色系在白底上更清楚
      const palette = [0xff6666,0xffa94d,0xffe166,0x8bd17c,0x57d4d4,0x6ea8ff,0xb190ff,0xff84c1,0xffffff];
      const idx = (x+1)*9 + (y+1)*3 + (z+1);
      return palette[(idx + (x!==0) + (y!==0) + (z!==0)) % palette.length];
    }

    let id=1;
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
      const m = new THREE.MeshStandardMaterial({color:colorFor(x,y,z), roughness:.4, metalness:.0});
      const cube = new THREE.Mesh(geo, m);
      cube.position.set(x*gap,y*gap,z*gap);
      cube.userData = { id:id++, grid:{x,y,z} };
      group.add(cube);
    }
    group.rotation.set(.4,.6,0);

    // 拾取 + 長按
    const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
    let down=null, timer=null, target=null;
    const LONG=600, MOVE=6;

    function setPointer(e){
      const r=renderer.domElement.getBoundingClientRect();
      const cx=(e.clientX ?? e.touches?.[0].clientX)-r.left;
      const cy=(e.clientY ?? e.touches?.[0].clientY)-r.top;
      pointer.set(cx/r.width*2-1, -(cy/r.height*2-1));
      pointer.sx = cx + r.left; pointer.sy = cy + r.top; // 螢幕座標
    }
    function pick(){
      ray.setFromCamera(pointer, camera);
      const hits = ray.intersectObjects(group.children,false);
      return hits[0]?.object || null;
    }
    function showTip(obj, x, y){
      const {id,grid}=obj.userData;
      const hex = '#'+obj.material.color.getHexString().toUpperCase();
      tip.innerHTML = `<span class="dot" style="background:${hex}"></span><b>Cubie #${id}</b><br>座標：(${grid.x}, ${grid.y}, ${grid.z})<br>顏色：${hex}`;
      tip.style.left = x+'px'; tip.style.top = y+'px'; tip.style.display='block';
    }
    function hideTip(){ tip.style.display='none'; }

    const el = renderer.domElement;
    el.addEventListener('pointerdown', e=>{
      hideTip(); setPointer(e); down={x:pointer.sx,y:pointer.sy,t:performance.now()};
      target = pick(); if(!target) return;
      timer = setTimeout(()=>showTip(target, pointer.sx, pointer.sy), LONG);
    });
    el.addEventListener('pointermove', e=>{
      if(!down) return;
      setPointer(e);
      if(Math.hypot(pointer.sx-down.x, pointer.sy-down.y) > MOVE){ clearTimeout(timer); }
    });
    el.addEventListener('pointerup',   ()=>{ clearTimeout(timer); down=null; });
    el.addEventListener('pointerleave',()=>{ clearTimeout(timer); hideTip(); down=null; });

    // 迴圈與自適應
    function onResize(){
      const w=stage.clientWidth,h=stage.clientHeight;
      camera.aspect=w/h; camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    }
    addEventListener('resize', onResize); onResize();

    (function tick(){
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene,camera);
    })();
  })();
  </script>
</body>
</html>
